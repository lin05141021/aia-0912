<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社群生活札記 | 圖文小心得</title>
  <!-- 採用相對路徑與快取清除版本號，確保 GitHub Pages 即時載入最新樣式 -->
  <link rel="stylesheet" href="./style.css?v=20260912">
</head>
<body>
  <!-- 頁面頂部導航 -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-icon">✨</span>
        <div>
          <h1 class="brand-title">生活隨筆札記</h1>
          <p class="brand-subtitle">記錄生活點滴與圖文小心得</p>
        </div>
      </div>
      <button class="btn btn-primary" id="openCreateModalBtn" aria-label="新增心得卡片">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>新增心得</span>
      </button>
    </div>
  </header>

  <!-- 主要內容區：社群貼文動態牆 -->
  <main class="feed-container" id="feedContainer">
    <!-- 卡片將由 app.js 從 localStorage 讀取並渲染，若無則顯示 Empty State -->
  </main>

  <!-- 空狀態提示樣板 (當無任何卡片時由 JS 插入) -->
  <template id="emptyStateTemplate">
    <div class="empty-state">
      <div class="empty-icon">📝</div>
      <h2 class="empty-title">尚無任何心得紀錄</h2>
      <p class="empty-desc">點擊右上角的「新增心得」按鈕，寫下今天的第一篇生活隨筆或專業筆記吧。</p>
      <button class="btn btn-primary" id="emptyCreateBtn">開始記錄第一篇</button>
    </div>
  </template>

  <!-- 彈出視窗：依 UX 流程引導新增圖文心得 (Modal Dialog) -->
  <div class="modal-overlay" id="createModal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 id="modalTitle" class="modal-title">📝 新增圖文小心得</h2>
        <button class="icon-btn modal-close-btn" id="closeCreateModalBtn" aria-label="關閉視窗">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <form id="newPostForm" class="modal-form">
        <!-- 步驟二：選擇主題 -->
        <div class="form-group">
          <label class="form-label">選擇主題分類</label>
          <div class="topic-options-grid">
            <label class="topic-card">
              <input type="radio" name="postTopic" value="專業知識分享" checked>
              <div class="topic-box">
                <span class="topic-icon">💡</span>
                <strong>專業知識分享</strong>
                <small>聚焦技術觀點、實作技巧與乾貨經驗</small>
              </div>
            </label>
            <label class="topic-card">
              <input type="radio" name="postTopic" value="心得雜記">
              <div class="topic-box">
                <span class="topic-icon">☕</span>
                <strong>心得雜記</strong>
                <small>日常生活、學習感悟與工作反思</small>
              </div>
            </label>
            <label class="topic-card">
              <input type="radio" name="postTopic" value="資訊分享">
              <div class="topic-box">
                <span class="topic-icon">🔗</span>
                <strong>資訊分享</strong>
                <small>工具推薦、行業動態與實用資源</small>
              </div>
            </label>
          </div>
        </div>

        <!-- 基本資訊 -->
        <div class="form-row">
          <div class="form-group">
            <label for="authorNameInput" class="form-label">作者名稱</label>
            <input type="text" id="authorNameInput" placeholder="例如：生活觀察家 或 @daily_notes" required value="生活觀察家">
          </div>
          <div class="form-group">
            <label for="locationInput" class="form-label">心情或地點標記</label>
            <input type="text" id="locationInput" placeholder="例如：台北 • 角落咖啡 或 🌿 今日微風" value="台北 • 午後散步">
          </div>
        </div>

        <!-- 步驟三：簡短想法輸入 -->
        <div class="form-group">
          <label for="contentTextInput" class="form-label">心得內容</label>
          <textarea id="contentTextInput" rows="4" placeholder="簡短寫下今天想記錄的事，幾句話即可..." required></textarea>
          <div class="content-assistant-row">
            <button type="button" class="btn-text-action" id="formatRulesBtn">
              ✨ 依低調務實風格自動潤飾排版
            </button>
            <span class="text-hint">符合中英文半形空格與全形標點</span>
          </div>
        </div>

        <!-- 步驟五：照片確認與處理 (支援手動上傳或風格配圖) -->
        <div class="form-group">
          <label class="form-label">卡片配圖設定</label>
          <div class="photo-method-tabs">
            <button type="button" class="tab-btn active" id="tabPresetBtn">風格推薦配圖</button>
            <button type="button" class="tab-btn" id="tabUploadBtn">自行上傳照片</button>
          </div>

          <!-- 風格推薦配圖區 -->
          <div id="presetPhotoSection" class="photo-tab-panel active">
            <div class="preset-images-grid" id="presetImagesContainer">
              <label class="preset-option">
                <input type="radio" name="presetImg" value="https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=1000&q=80" checked>
                <img src="https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=200&h=200&q=80" alt="午後手沖咖啡與手札">
              </label>
              <label class="preset-option">
                <input type="radio" name="presetImg" value="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1000&q=80">
                <img src="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=200&h=200&q=80" alt="清晨森林與陽光">
              </label>
              <label class="preset-option">
                <input type="radio" name="presetImg" value="https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=1000&q=80">
                <img src="https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=200&h=200&q=80" alt="書頁與學習筆記">
              </label>
              <label class="preset-option">
                <input type="radio" name="presetImg" value="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=1000&q=80">
                <img src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=200&h=200&q=80" alt="筆電與專案開發">
              </label>
            </div>
            <input type="url" id="customImageUrlInput" class="form-input-sub" placeholder="或貼上自訂圖片網址 (https://...)">
          </div>

          <!-- 自行上傳照片區 -->
          <div id="uploadPhotoSection" class="photo-tab-panel">
            <div class="upload-dropzone" id="uploadDropzone">
              <input type="file" id="localFileInput" accept="image/jpeg,image/png,image/webp" class="file-input-hidden">
              <div class="dropzone-prompt" id="dropzonePrompt">
                <span class="upload-icon">📷</span>
                <p>點擊此處選擇照片，或將圖檔拖曳至此</p>
                <small>支援 JPG、PNG、WebP 格式，提供即時預覽</small>
              </div>
              <div class="upload-preview-wrapper" id="uploadPreviewWrapper" style="display: none;">
                <img id="uploadPreviewImg" src="" alt="自行上傳照片預覽" class="upload-preview-img">
                <button type="button" class="btn-remove-photo" id="removeUploadedPhotoBtn">移除照片</button>
              </div>
            </div>
          </div>
        </div>

        <!-- 標籤設定 -->
        <div class="form-group">
          <label for="tagsInput" class="form-label">主題標籤（以空格或半形逗號分隔）</label>
          <input type="text" id="tagsInput" placeholder="例如：#前端開發 #心得記錄 #實作經驗" value="#心得筆記 #生活隨筆">
        </div>

        <!-- 彈窗操作按鈕 -->
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancelPostBtn">取消</button>
          <button type="submit" class="btn btn-primary">完成並發布卡片</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 輕量 Toast 提示訊息 -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <!-- 腳本引入放在 body 底部並帶版本參數避免快取問題 -->
  <script src="./app.js?v=20260912" defer></script>
</body>
</html>
