<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 IG 生活筆記牆 | 懶人隨筆自動歸檔</title>
  <!-- 採用相對路徑與快取清除版本號，確保即時載入最新 PANTONE 莫蘭迪樣式 -->
  <link rel="stylesheet" href="./style.css?v=20260912-pantone">
</head>
<body>
  <!-- 頁面頂部導航 -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-icon">📸</span>
        <div>
          <h1 class="brand-title">個人生活筆記牆</h1>
          <p class="brand-subtitle">為懶人設計的日常微記錄 • 模擬 IG 自動發文格式</p>
        </div>
      </div>
      <button class="btn btn-primary" id="openCreateModalBtn" aria-label="新增隨手筆記">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>快速記錄</span>
      </button>
    </div>
  </header>

  <!-- 個人 Profile 檔案列 (強調單一帳號，非多人社群) -->
  <section class="profile-summary-section">
    <div class="profile-card">
      <div class="profile-avatar-wrapper">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=160&h=160&q=80" alt="個人專屬頭像" class="profile-avatar" id="globalUserAvatar">
        <span class="story-ring-indicator"></span>
      </div>
      <div class="profile-details">
        <div class="profile-name-row">
          <h2 class="profile-username" id="globalUserHandle">@daily_log</h2>
          <span class="profile-badge" title="個人筆記作者">✓</span>
          <span class="profile-status-pill">個人日常歸檔</span>
        </div>
        <p class="profile-bio">
          生活觀察與技術閱讀雜記。不需要長篇大論，隨手幾句話、一張照片，讓懶散也能自然沉澱出專屬的生活足跡。☕📖
        </p>
        <div class="profile-stats">
          <div class="stat-item">
            <strong class="stat-number" id="totalPostsCount">0</strong>
            <span class="stat-label">篇筆記</span>
          </div>
          <div class="stat-item">
            <strong class="stat-number" id="totalLikesCount">0</strong>
            <span class="stat-label">個收藏點讚</span>
          </div>
          <div class="stat-item">
            <strong class="stat-number">3</strong>
            <span class="stat-label">分類主題</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 主要動態牆：個人 IG 貼文卡片列表 -->
  <main class="feed-container" id="feedContainer">
    <!-- 卡片將由 app.js 自 localStorage 讀取並渲染，統一由個人單一帳號發布 -->
  </main>

  <!-- 空狀態提示樣板 -->
  <template id="emptyStateTemplate">
    <div class="empty-state">
      <div class="empty-icon">📷</div>
      <h3 class="empty-title">尚未發布任何 IG 筆記卡片</h3>
      <p class="empty-desc">點擊右上角的「快速記錄」，選個主題、隨手寫兩句話，系統會自動為你排版成高質感的 IG 貼文卡片。</p>
      <button class="btn btn-primary" id="emptyCreateBtn">記錄第一篇心得</button>
    </div>
  </template>

  <!-- 彈出視窗：懶人極低阻力發文器 (Modal Dialog) -->
  <div class="modal-overlay" id="createModal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h3 id="modalTitle" class="modal-title">✨ 寫下隨手小心得</h3>
        <button class="icon-btn modal-close-btn" id="closeCreateModalBtn" aria-label="關閉視窗">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <form id="newPostForm" class="modal-form">
        <!-- 步驟一：主題三選一（莫蘭迪色彩對應） -->
        <div class="form-group">
          <label class="form-label">選擇筆記主題</label>
          <div class="topic-options-grid">
            <label class="topic-card topic-knowledge">
              <input type="radio" name="postTopic" value="專業知識分享" checked>
              <div class="topic-box">
                <span class="topic-icon">💡</span>
                <strong>專業知識分享</strong>
                <small>閱讀筆記、文章金句與實作技巧</small>
              </div>
            </label>
            <label class="topic-card topic-diary">
              <input type="radio" name="postTopic" value="心得雜記">
              <div class="topic-box">
                <span class="topic-icon">☕</span>
                <strong>心得雜記</strong>
                <small>日常生活、微幽默自嘲與思維沉澱</small>
              </div>
            </label>
            <label class="topic-card topic-travel">
              <input type="radio" name="postTopic" value="資訊分享">
              <div class="topic-box">
                <span class="topic-icon">🚶‍♂️</span>
                <strong>資訊分享</strong>
                <small>景點美食實訪、避坑情報與生活探索</small>
              </div>
            </label>
          </div>
        </div>

        <!-- 步驟二：簡短想法輸入（核心懶人功能） -->
        <div class="form-group">
          <label for="contentTextInput" class="form-label">心得隨筆（隨便寫兩句即可）</label>
          <textarea id="contentTextInput" rows="4" placeholder="簡短寫下今天想記錄的事，幾句話即可..." required></textarea>
          <div class="content-assistant-row">
            <button type="button" class="btn-text-action" id="formatRulesBtn">
              🪄 一鍵依沉穩規範自動潤飾排版
            </button>
            <span class="text-hint">自動加入中英半形空格與全形標點</span>
          </div>
        </div>

        <!-- 步驟三：照片設定（1:1 IG 經典正方形規格） -->
        <div class="form-group">
          <label class="form-label">IG 卡片配圖（AI 依內文自動生成 或 自行上傳）</label>
          <div class="photo-method-tabs">
            <button type="button" class="tab-btn active" id="tabAiPhotoBtn">✨ AI 依內文智慧生圖</button>
            <button type="button" class="tab-btn" id="tabUploadBtn">📸 自行上傳照片</button>
          </div>

          <!-- AI 依內文智慧生圖區 (動態語意辨識配圖) -->
          <div id="aiPhotoSection" class="photo-tab-panel active">
            <div class="ai-visual-box">
              <div class="ai-visual-ctrl">
                <div class="ai-status-indicator" id="aiStatusIndicator">
                  <span class="pulse-dot"></span>
                  <span id="aiStatusText">已連線 AI 視覺生成：依據您輸入的心得自動分析配圖</span>
                </div>
                <button type="button" class="btn btn-secondary btn-sm" id="btnAiRegenerate">
                  ✨ 依內文重新辨識生圖
                </button>
              </div>

              <!-- AI 1:1 即時預覽容器 -->
              <div class="ai-preview-container" id="aiPreviewContainer">
                <img id="aiGeneratedPreviewImg" src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=800&h=800&q=80" alt="AI 依文章內容生成的配圖" class="ai-preview-img">
                <div class="ai-keyword-badge" id="aiKeywordBadge">
                  <span class="ai-badge-icon">🤖</span>
                  <span id="aiKeywordsDisplay">#AI語意辨識 #工作桌螢幕 #冷灰科技</span>
                </div>
                <div class="ai-generating-mask" id="aiGeneratingMask" style="display: none;">
                  <div class="ai-spinner"></div>
                  <p id="aiMaskText">AI 正在深度辨識文章關鍵字與氛圍...</p>
                </div>
              </div>
            </div>
            <input type="hidden" id="aiGeneratedImgUrl" value="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=800&h=800&q=80">
            <input type="url" id="customImageUrlInput" class="form-input-sub" placeholder="或貼上自訂圖片網址 (https://...)">
          </div>

          <!-- 自行上傳照片區 -->
          <div id="uploadPhotoSection" class="photo-tab-panel">
            <div class="upload-dropzone" id="uploadDropzone">
              <input type="file" id="localFileInput" accept="image/jpeg,image/png,image/webp" class="file-input-hidden">
              <div class="dropzone-prompt" id="dropzonePrompt">
                <span class="upload-icon">📸</span>
                <p>點擊選擇照片，或拖曳圖檔至此</p>
                <small>自動裁切適配 IG 1:1 正方形經典比例</small>
              </div>
              <div class="upload-preview-wrapper" id="uploadPreviewWrapper" style="display: none;">
                <img id="uploadPreviewImg" src="" alt="上傳照片預覽" class="upload-preview-img">
                <button type="button" class="btn-remove-photo" id="removeUploadedPhotoBtn">移除並重選</button>
              </div>
            </div>
          </div>
        </div>

        <!-- 步驟四：附加資訊（地點與標籤） -->
        <div class="form-row">
          <div class="form-group">
            <label for="locationInput" class="form-label">地點標記（選填）</label>
            <input type="text" id="locationInput" placeholder="例如：台北 • 永康街角落咖啡" value="台北 • 書房角落">
          </div>
          <div class="form-group">
            <label for="tagsInput" class="form-label">標籤（自動帶入）</label>
            <input type="text" id="tagsInput" placeholder="#日常筆記 #閱讀隨想" value="#日常記錄 #隨手心得">
          </div>
        </div>

        <!-- 表單操作 -->
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancelPostBtn">取消</button>
          <button type="submit" class="btn btn-primary">儲存並產生 IG 卡片</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 輕量 Toast 提示 -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <!-- 載入核心邏輯 -->
  <script src="./app.js?v=20260912-pantone" defer></script>
</body>
</html>
